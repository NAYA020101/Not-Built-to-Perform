<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOME</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    font-family: "Times New Roman", serif;
    color: #fff;
    background-color: #111;
  }

  /* ✅ 背景图路径已修复 */
  .home-bg {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 70%;
    height: 75%;
    transform: translate(-50%, -50%);
    background-image: url('../images/3.png');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -1;
    opacity: 0.9;
  }

  /* 返回按钮 */
  .back-btn {
    position: fixed;
    top: 2rem;
    left: 2rem;
    font-size: 1.1rem;
    color: #fff;
    text-decoration: none;
    z-index: 999;
    font-weight: bold;
    transition: all 0.3s ease;
  }
  .back-btn:hover {
    opacity: 0.7;
    transform: translateX(-3px);
  }

  /* 居中布局 */
  .center-wrap {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5vw;
  }
  .inner-content {
    text-align: center;
  }
  .inner-content p {
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    margin: 1.5rem 0;
    opacity: 0.9;
    animation: breathe 2.8s infinite ease-in-out;
    text-shadow: 0 0 12px rgba(255,255,255,0.2);
  }

  /* 呼吸效果 */
  @keyframes breathe {
    0%, 100% {
      transform: translateY(0);
      opacity: 0.9;
    }
    50% {
      transform: translateY(-6px);
      opacity: 1;
    }
  }

  .inner-content p:nth-child(1) { animation-delay: 0s; }
  .inner-content p:nth-child(2) { animation-delay: 0.2s; }
  .inner-content p:nth-child(3) { animation-delay: 0.4s; }
</style>
</head>

<body class="home-page">

<!-- ✅ 返回路径已修复 -->
<a href="../index.html" class="back-btn">← Back to Home</a>
<div class="home-bg"></div>

<div class="center-wrap">
  <div class="inner-content">
    <p>She writes.</p>
    <p>She defines.</p>
    <p>She refuses to perform.</p>
  </div>
</div>

</body>
</html>
